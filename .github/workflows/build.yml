name: Build

on:
  push:
    branches:
      - feature/*
      - release/*
      - master
  pull_request:
    branches:
      - feature/*
      - release/*
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5.0.1
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build -c Release --no-restore
        
    - name: Run tests
      run: dotnet test
